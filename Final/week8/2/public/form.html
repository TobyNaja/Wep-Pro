<style>
    :root {
        --primary-color: #4f46e5; /* สีน้ำเงินม่วงทันสมัย */
        --primary-hover: #4338ca;
        --bg-color: #f3f4f6;
        --text-dark: #1f2937;
        --text-gray: #6b7280;
    }

    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: var(--bg-color);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    form {
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 360px; /* ขนาดหน้าต่าง Login */
    }

    /* ตกแต่งหัวข้อ (ถ้าคุณอยากเพิ่ม <h2>Login</h2> ไว้ข้างบน) */
    form::before {
        content: "Welcome Back";
        display: block;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 25px;
        text-align: center;
    }

    label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-gray);
        margin-bottom: 6px;
        display: inline-block;
    }

    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 20px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        box-sizing: border-box; /* สำคัญ: กัน input ล้น */
        transition: all 0.2s ease;
        outline: none;
    }

    input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
    }

    button:hover {
        background-color: var(--primary-hover);
    }

    button:active {
        transform: scale(0.98);
    }
</style>

<body>
    <form action="formget" method="GET">
        <label for="username">Username Or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter your email">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••">

        <button type="submit">Login</button>
    </form>
</body>
