<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incorrect Password</title>
    <style>
        body {
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            background-color: #fef2f2; 
            font-family: 'Segoe UI', sans-serif;
        }
        .alert-card {
            background: white; 
            padding: 40px; 
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
            max-width: 400px; 
            width: 90%; 
            border-top: 5px solid #ef4444;
        }
        .icon { 
            font-size: 50px; 
            color: #ef4444; 
            margin-bottom: 20px; 
        }

        h1 { 
            color: #1f2937; 
            font-size: 24px; 
            margin-bottom: 10px; 
        }

        p { 
            color: #6b7280; 
            margin-bottom: 30px; }
        .btn {
            display: inline-block; 
            background-color: #ef4444; 
            color: white;
            padding: 12px 24px; 
            border-radius: 10px; 
            text-decoration: none;
            font-weight: 600; 
            transition: 0.3s;
        }
        .btn:hover { background-color: #dc2626; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="alert-card">
        <div class="icon">🚫</div>
        <h1>รหัสผ่านไม่ถูกต้อง</h1>
        <p>คุณระบุรหัสผ่านผิด กรุณาลองใหม่อีกครั้ง</p>
        <a href="/" class="btn">ลองใหม่อีกครั้ง</a>
    </div>
</body>
</html>
